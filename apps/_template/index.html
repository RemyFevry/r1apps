<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=240, initial-scale=1.0, user-scalable=no">
  <title>R1 App</title>
  <style>
    :root { --bg:#0e0e10; --accent:#FE5000; --dim:rgba(255,255,255,0.55); }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 240px; height: 282px; overflow: hidden; }
    body { background: var(--bg); color: #fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    .wrap { width: 240px; height: 282px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
    .brand { font-size: 10px; letter-spacing: 1px; text-transform: uppercase; color: var(--accent); }
    #n { font-size: 48px; font-weight: 600; }
    .hint { font-size: 11px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">r1 template</div>
    <div id="n">0</div>
    <div class="hint">scroll = ±1 · side = reset · hold = exit</div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
